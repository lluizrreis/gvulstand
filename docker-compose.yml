services:
  # PostgreSQL Database Service (High-Performance ACID & Analytics)
  postgres:
    image: postgres:16-alpine
    container_name: gvulstand_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gvulstand}
      POSTGRES_USER: ${POSTGRES_USER:-gvuluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gvuluser} -d ${POSTGRES_DB:-gvulstand}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gvulstand_net

  # GvulStand Web & Backend Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gvulstand_app
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-gvuluser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gvulstand}
      - SECRET_KEY=${SECRET_KEY}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-Admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-Admin}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@gvulstand.local}
    ports:
      - "${APP_PORT:-8888}:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./frontend:/app/frontend
      - ./backend/app:/app/backend/app
      - ./backend/tests:/app/backend/tests
    networks:
      - gvulstand_net

volumes:
  postgres_data:
    name: gvulstand_postgres_data
    external: true

networks:
  gvulstand_net:
    driver: bridge
